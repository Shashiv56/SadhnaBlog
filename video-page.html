<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Blog Post</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<a href="index.html">← Back to Hub</a>
<h1>Watch the Video</h1>


<!-- Portrait layout wrapper optimized for YouTube Shorts -->
<div class="video-container" style="max-width: 315px; margin: 0 auto;">
    <!-- 🚨 Added id="blogVideo" and ?enablejsapi=1 for analytics tracking -->
    <iframe id="blogVideo" width="315" height="560"
            src="https://www.youtube.com/embed/p4rUQFLFqXc?enablejsapi=1"
            title="Rise Before 4 AM: Defeat Māyā Before Her Business Begins – Śrīla Prabhupāda’s Wake-Up Call"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
</div>


<script src="analytics.js"></script>
</body>
</html>
